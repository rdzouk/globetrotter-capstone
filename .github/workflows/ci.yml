name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            globetrotter-monolith/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: globetrotter-monolith/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: globetrotter-monolith/backend
        run: pytest tests -q

  frontend-tests:
    name: React tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: globetrotter-monolith/frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: globetrotter-monolith/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test and build React
        run: |
          npm test
          npm run build
          npm run test:e2e

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t globetrotter-backend:${{ github.sha }} ./globetrotter-monolith/backend

      - name: Build frontend Docker image
        run: docker build -t globetrotter-frontend:${{ github.sha }} ./globetrotter-monolith/frontend

  security-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit backend dependencies
        working-directory: globetrotter-monolith/backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt || true
