name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            globetrotter-monolith/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: globetrotter-monolith/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: globetrotter-monolith/backend
        run: pytest tests -q

  microservice-tests:
    name: Microservice tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - itinerary-service
          - recommendation-service
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: globetrotter-monolith/microservices/${{ matrix.service }}/requirements.txt

      - name: Install service dependencies
        working-directory: globetrotter-monolith/microservices/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run service tests
        working-directory: globetrotter-monolith/microservices/${{ matrix.service }}
        run: pytest tests -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - microservice-tests
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t globetrotter-backend:${{ github.sha }} ./globetrotter-monolith/backend

  security-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit backend dependencies
        working-directory: globetrotter-monolith/backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt || true
