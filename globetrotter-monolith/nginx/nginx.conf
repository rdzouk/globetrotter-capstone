# GlobeTrotter — Nginx reverse proxy
#
# Serves the static frontend directly (fast, no Python involved) and
# reverse-proxies /api/ to the Flask/Gunicorn backend, stripping the
# /api prefix so the backend itself doesn't need to know about it.
#
# HTTPS: this file assumes TLS termination happens here via
# Let's Encrypt certs (see DEPLOYMENT.md) OR upstream at Cloudflare
# with "Full" SSL mode — either way, uncomment the 443 server block
# and the certificate paths once you have real certs. The 80 block
# below redirects to HTTPS once that's live; until then it serves
# plain HTTP for initial setup/testing.

# Rate-limit zone for basic request-flood protection at the proxy
# layer, on top of the app's own Flask-Limiter rules.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    return 301 https://gaeglobetrotter.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name gaeglobetrotter.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/gaeglobetrotter.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaeglobetrotter.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 2M;
    limit_req zone=general burst=20 nodelay;

    # Security headers (the backend also sets its own on API
    # responses — these cover the static frontend too).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static frontend — served directly by Nginx, no proxying.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache static assets aggressively; HTML pages are small and
    # change more often, so they're not cached long.
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Reverse proxy to the backend API. Note the trailing slash on
    # proxy_pass — that's what strips the /api prefix, so a request to
    # /api/login reaches the backend as /login.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
