name: CI

on:
  push:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (flake8 — syntax errors and undefined names only)
        working-directory: backend
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,.venv

      - name: Run tests
        working-directory: backend
        run: pytest -v

  test-microservices:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, itinerary-service, recommendation-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: microservices/${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: microservices/${{ matrix.service }}
        run: pytest -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependency vulnerability scan
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true  # report only, don't fail the build on advisory-only findings

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t globetrotter-backend:ci ./backend
