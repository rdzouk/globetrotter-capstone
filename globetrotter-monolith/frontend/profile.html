<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — GlobeTrotter</title>
  <meta name="description" content="Manage your GlobeTrotter account settings.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="static/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a6b6b">
  <link rel="apple-touch-icon" href="static/icons/icon-192.png">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container" id="main-content">
    <h1>Your account</h1>

    <div id="profile-content">
      <p class="muted">Loading...</p>
    </div>
  </main>

  <div id="modal-placeholder"></div>

  <script src="static/layout.js"></script>
  <script src="static/config.js"></script>
  <script src="static/i18n.js"></script>
  <script src="static/app.js"></script>
  <script>
    const ALL_TAGS = ["restaurant","fancy","casual","affordable","spa","sports","nightlife","hotel","attraction","entertainment","landmark","live-music","outdoor","family-friendly"];

    async function loadProfile() {
      const container = document.getElementById('profile-content');
      const token = localStorage.getItem('gt_token');
      if (!token) {
        container.innerHTML = '<p class="muted">Please <a href="login.html">log in</a> to view your account.</p>';
        return;
      }
      try {
        const res = await fetch(`${API_BASE_URL}/profile`, { headers: { 'Authorization': 'Bearer ' + token } });
        if (res.status === 401) {
          localStorage.removeItem('gt_token');
          container.innerHTML = '<p class="muted">Session expired. Please <a href="login.html">log in</a> again.</p>';
          return;
        }
        const profile = await res.json();
        container.innerHTML = `
          <div class="form-card" style="max-width:600px; margin-bottom:20px;">
            <h2 style="margin-top:0;">Identity</h2>
            <label>Name</label>
            <input type="text" id="profile-name" value="${profile.name}">
            <label>Email</label>
            <input type="text" value="${profile.email || '—'}" disabled>
            <label>Phone</label>
            <input type="text" value="${profile.phone || '—'}" disabled>
            <p class="muted" style="font-size:0.8rem;">Email/phone can't be changed here since it's your account identifier — contact support if you need that updated.</p>

            <h2>Places of interest</h2>
            <div class="checkbox-group">
              ${ALL_TAGS.map(t => `
                <label class="checkbox-label">
                  <input type="checkbox" value="${t}" class="profile-pref-checkbox" ${profile.preferences.includes(t) ? 'checked' : ''}> ${t}
                </label>
              `).join('')}
            </div>

            <button id="save-profile-btn" style="margin-top:18px;">Save changes</button>
            <p id="profile-message"></p>
          </div>

          <div class="form-card" style="max-width:600px;">
            <h2 style="margin-top:0;">Preferences</h2>
            <label>Language</label>
            <select id="profile-lang">
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
            <label>Appearance</label>
            <select id="profile-theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
        `;

        document.getElementById('profile-lang').value = gtLang();
        document.getElementById('profile-lang').addEventListener('change', (e) => setLang(e.target.value));
        document.getElementById('profile-theme').value = gtTheme();
        document.getElementById('profile-theme').addEventListener('change', (e) => setTheme(e.target.value));

        document.getElementById('save-profile-btn').addEventListener('click', async () => {
          const msg = document.getElementById('profile-message');
          const name = document.getElementById('profile-name').value;
          const preferences = Array.from(document.querySelectorAll('.profile-pref-checkbox:checked')).map(c => c.value);
          try {
            const res = await fetch(`${API_BASE_URL}/profile`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ name, preferences })
            });
            const data = await res.json();
            if (!res.ok) {
              msg.textContent = (data.errors && data.errors.join(', ')) || 'Could not save';
              msg.className = 'error';
              return;
            }
            localStorage.setItem('gt_name', data.name);
            renderNavAuth();
            msg.textContent = 'Saved!';
            msg.className = 'success';
          } catch (err) {
            msg.textContent = 'Network error: ' + err;
            msg.className = 'error';
          }
        });
      } catch (err) {
        container.innerHTML = '<p class="error">Could not load profile: ' + err + '</p>';
      }
    }

    loadProfile();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
