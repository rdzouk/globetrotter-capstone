{% extends "base.html" %}
{% block title %}Favorites — GlobeTrotter{% endblock %}
{% block content %}
  <h1>Your favorites</h1>
  <p class="muted">Places you've hearted, all in one place.</p>
  <div id="favorites-grid" class="card-grid">
    <p class="muted">Loading...</p>
  </div>
{% endblock %}
{% block scripts %}
<script>
  async function loadFavorites() {
    const grid = document.getElementById('favorites-grid');
    const token = localStorage.getItem('gt_token');
    if (!token) {
      grid.innerHTML = '<p class="muted">Please <a href="{{ url_for("page_login") }}">log in</a> to see your favorites.</p>';
      return;
    }
    try {
      const res = await fetch(`${API_BASE_URL}/favorites`, { headers: { 'Authorization': 'Bearer ' + token } });
      if (res.status === 401) {
        localStorage.removeItem('gt_token');
        grid.innerHTML = '<p class="muted">Session expired. Please <a href="{{ url_for("page_login") }}">log in</a> again.</p>';
        return;
      }
      const places = await res.json();
      gtFavoriteIds = new Set(places.map(p => p.id));
      if (!places.length) {
        grid.innerHTML = '<p class="muted">No favorites yet — tap the 🤍 on any place in <a href="{{ url_for("page_home") }}">Destinations</a> to add one.</p>';
        return;
      }
      grid.innerHTML = places.map(d => `
        <div class="card">
          <div class="card-image-wrapper">
            <img class="place-image" src="${d.image_url}" alt="${d.name}" loading="lazy">
            ${gtHeartHtml(d.id)}
          </div>
          <div class="card-header">
            <h3>${d.name}</h3>
            <span class="category-badge category-${d.category}">${d.category}</span>
          </div>
          <p class="muted">${d.neighborhood} · ${d.address}</p>
          <p>${d.description}</p>
          <p class="popularity">⭐ ${d.rating} (${d.rating_count} ratings)</p>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button onclick="openBookModal(${d.id}, '${d.name.replace(/'/g, "\\'")}', ${d.lat}, ${d.lng})">Plan itinerary</button>
            <a class="secondary-link-btn" href="{{ url_for('page_map') }}?place=${d.id}">Show on map</a>
          </div>
        </div>
      `).join('');
    } catch (err) {
      grid.innerHTML = '<p class="error">Could not load favorites: ' + err + '</p>';
    }
  }

  document.addEventListener('gt:favorites-changed', loadFavorites);
  loadFavorites();
</script>
{% endblock %}
