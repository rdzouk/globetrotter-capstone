{% extends "base.html" %}
{% block title %}Log in — GlobeTrotter{% endblock %}
{% block content %}
  <div class="form-card">
    <h1>Log in</h1>
    <form id="login-form">
      <label>Log in with</label>
      <div class="identifier-toggle">
        <label><input type="radio" name="identifier-type" value="email" checked> Email</label>
        <label><input type="radio" name="identifier-type" value="phone"> Phone number</label>
      </div>
      <input type="text" id="identifier" placeholder="you@example.com" required>

      <label>Password</label>
      <input type="password" id="password" required>

      <button type="submit">Log in</button>
      <p id="login-message"></p>
    </form>
    <p>New here? <a href="{{ url_for('page_register') }}">Create an account</a></p>
  </div>
{% endblock %}
{% block scripts %}
<script>
  const identifierInput = document.getElementById('identifier');
  document.querySelectorAll('input[name="identifier-type"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const isEmail = document.querySelector('input[name="identifier-type"]:checked').value === 'email';
      identifierInput.placeholder = isEmail ? 'you@example.com' : '+237 6XX XXX XXX';
      identifierInput.type = isEmail ? 'email' : 'tel';
      identifierInput.value = '';
    });
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const identifierType = document.querySelector('input[name="identifier-type"]:checked').value;
    const identifierValue = document.getElementById('identifier').value;
    const msg = document.getElementById('login-message');

    const payload = { password };
    if (identifierType === 'email') payload.email = identifierValue;
    else payload.phone = identifierValue;

    try {
      const res = await fetch(`${API_BASE_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Login failed';
        msg.className = 'error';
        return;
      }
      localStorage.setItem('gt_token', data.token);
      localStorage.setItem('gt_name', data.name);
      window.location.href = "{{ url_for('page_home') }}";
    } catch (err) {
      msg.textContent = 'Network error: ' + err;
      msg.className = 'error';
    }
  });
</script>
{% endblock %}
